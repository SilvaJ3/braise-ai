<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vos pièces en dépôt</title>
<style>
/* La page que la boutique ouvre depuis son lien. Aucun compte, aucun mot de passe : le jeton de
   l'adresse EST l'accès. Mobile d'abord, parce qu'on la lit debout dans la réserve. */
:root{
  --vert:#2E5339; --texte:#292826; --gris:#6f6f6e; --trait:#e2e0d9; --creme:#FBF9F5;
  --bandeau:#EBF1E9; --zebre:#F7F8F5; --ko:#8C3B2E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--texte);
     font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.page{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06)}
header{background:var(--vert);color:#fff;padding:20px 22px}
.marque{font:600 13px/1 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
h1{font:600 22px/1.2 Georgia,serif;margin:8px 0 4px}
header p{margin:0;font-size:13.5px;opacity:.9}
main{padding:18px 20px 44px}
h2{font:600 15px/1.3 Georgia,serif;margin:26px 0 10px}
.intro{background:var(--bandeau);border-radius:10px;padding:13px 15px;font-size:13.5px;margin:0 0 6px}
.aide{color:var(--gris);font-size:12.5px;margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 16px}
th{background:var(--bandeau);text-align:left;font:600 11.5px/1.3 helvetica,sans-serif;
   letter-spacing:.04em;text-transform:uppercase;color:#41553f;padding:11px 9px}
th.d,td.d{text-align:right}
tbody tr:nth-child(odd){background:var(--zebre)}
td{padding:14px 9px;border-bottom:1px solid var(--trait);vertical-align:middle}
.piece{display:block;font-weight:600}
.sous{display:block;color:var(--gris);font-size:12.5px;margin-top:2px}
input[type=number]{width:88px;padding:11px 12px;border:1px solid #cfd4cb;border-radius:9px;
   font:inherit;font-size:16px;text-align:right;min-height:46px}
input[type=text],textarea{width:100%;padding:12px;border:1px solid #cfd4cb;border-radius:9px;
   font:inherit;font-size:16px;margin:0 0 4px}
.mouvement{margin:2px 0 4px;font-size:13px;color:var(--gris);line-height:1.9}
.mouvement input{margin:0 6px;width:76px}
button{font:inherit;cursor:pointer}
.principal{width:100%;background:var(--vert);color:#fff;border:0;border-radius:9px;
   padding:14px;font-size:15px;font-weight:600;margin-top:18px}
.secondaire{width:100%;background:#fff;color:var(--vert);border:1px solid var(--vert);
   border-radius:9px;padding:15px;font-size:15px;font-weight:600;margin-top:16px}
.message{margin:10px 0 0;font-size:13.5px}
.message.ok{color:var(--vert)}
.message.ko{color:var(--ko)}
.historique{width:100%;border-collapse:collapse;font-size:13.5px}
.historique td{padding:8px 6px}
.note{color:var(--gris);font-size:12px;margin-top:26px;padding-top:14px;border-top:1px solid var(--trait)}
select{width:100%;padding:10px;border:1px solid #cfd4cb;border-radius:8px;font:inherit}
.carte{border:1px solid var(--trait);border-radius:11px;padding:14px;margin-bottom:14px}
.pas{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pas button{width:36px;height:36px;border-radius:50%;border:1px solid var(--vert);background:#fff;
  color:var(--vert);font-size:17px;line-height:1;padding:0;display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.pas button.plus{background:var(--vert);color:#fff}
.pas input[type=number]{width:56px;text-align:center;padding:8px 4px;font-size:16px;min-height:38px;
  border-radius:999px}
.pas.mini{gap:6px}
.pas.mini button{width:30px;height:30px;font-size:15px}
.pas.mini input[type=number]{width:46px;padding:5px 2px;font-size:15px;min-height:32px;border-radius:999px}
.repartition{margin:4px 0 2px;font-size:13px;color:var(--gris)}
.repartition-titre{margin-bottom:6px}
.repartition-ligne{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:7px;max-width:300px}
.repartition-ligne span{font-size:13px}
.bon-lignes{margin:10px 0 12px;padding-left:18px;font-size:13.5px;color:#3a3a38}
.bon-lignes li{margin:2px 0}
/* Signaler un bon : la même chose qu'une confirmation ratée, mais dite avec des mots. Le bon,
   lui, n'est pas modifié — c'est un message à l'artisan, et la page le dit à l'écran. */
.signaler{width:100%;background:#fff;color:var(--ko);border:1px solid var(--ko);
   border-radius:9px;padding:13px;font-size:14px;font-weight:600;margin-top:10px}
.contest{margin-top:12px;padding-top:12px;border-top:1px solid var(--trait)}
.contest label{display:block;font-size:13px;color:var(--gris);margin:0 0 6px}
/* Une pièce ajoutée depuis le catalogue de l'artisan : elle se retire aussi simplement. */
.retirer{display:block;margin-top:3px;background:none;border:0;padding:0;color:var(--ko);
  font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="marque" id="marque">Espace de la boutique</div>
    <h1 id="titre">Vos pièces en dépôt</h1>
    <p id="sous-titre">Rien à installer, rien à créer.</p>
  </header>

  <main id="contenu">
    <p class="aide">Chargement…</p>
  </main>
</div>

<script type="module">
const SUPABASE_URL = 'https://nnssqleqvfafbkkxyqne.supabase.co'
const CLE_PUBLIQUE = 'sb_publishable_k-84JsMb8QmX70s6Gh3FGw_iaEc-hyE'

const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2')
const supabase = createClient(SUPABASE_URL, CLE_PUBLIQUE)

const jeton = new URLSearchParams(location.search).get('t') || location.hash.slice(1)
const contenu = document.getElementById('contenu')
const $ = (id) => document.getElementById(id)
const echapper = (t) => String(t ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const eur = (n) => (Math.round((Number(n) + Number.EPSILON) * 100) / 100)
  .toLocaleString('fr-BE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'
const dateCourte = (iso) => {
  try { return new Date(iso).toLocaleDateString('fr-BE', { day: 'numeric', month: 'long' }) }
  catch { return '' }
}
const mois = (iso) => {
  try { return new Date(iso).toLocaleDateString('fr-BE', { month: 'long', year: 'numeric' }) }
  catch { return '' }
}

if (!jeton) {
  contenu.innerHTML = '<p class="message ko">Ce lien est incomplet. Demandez à l\'artisan de vous le renvoyer.</p>'
} else {
  demarrer()
}

let etat = null
let partenaireCourant = null

async function demarrer() {
  const { data, error } = await supabase.rpc('boutique_etat', { jeton_param: jeton })
  if (error || !data || data.erreur) {
    contenu.innerHTML = '<p class="message ko">Ce lien n\'est plus valable. Demandez-en un nouveau à l\'artisan.</p>'
    return
  }
  etat = data
  $('marque').textContent = (data.partenaires[0]?.artisan) || 'Espace de la boutique'
  partenaireCourant = data.partenaires[0]?.partenaire_id
  afficher()
}

function afficher() {
  const p = etat.partenaires.find((x) => x.partenaire_id === partenaireCourant) || etat.partenaires[0]
  const plusieurs = etat.partenaires.length > 1

  if (!p) {
    contenu.innerHTML = '<p class="aide">Aucune pièce en dépôt pour le moment.</p>'
    return
  }
  // Ce que l'artisan propose à la vente : de quoi demander une pièce qu'on n'a jamais reçue.
  const catalogue = p.catalogue || []

  if (!p.pieces.length && !(p.a_confirmer || []).length && !catalogue.length) {
    contenu.innerHTML = '<p class="aide">Aucune pièce en dépôt pour le moment.</p>'
    return
  }

  contenu.innerHTML = `
    <p class="intro">Bonjour. Comptez ce qu'il vous reste : l'application en déduit ce qui est
       parti. Rien ne s'envoie sans que vous cliquiez.</p>

    ${(p.a_confirmer || []).length ? `
      <h2>${p.a_confirmer.length > 1 ? 'Des bons à confirmer' : 'Un bon à confirmer'}</h2>
      <p class="aide">C'est votre confirmation qui fait entrer ces pièces dans votre stock — pas
         l'envoi du bon par l'artisan. Si un bon ne correspond pas, dites-le : c'est un message
         pour l'artisan, le bon n'est pas modifié.</p>
      ${p.a_confirmer.map((b) => `
        <div class="carte">
          <span class="piece">${b.numero ? 'Bon n° ' + b.numero : 'Bon'} — ${dateCourte(b.date)}</span>
          <span class="sous">${b.pieces} pièce${b.pieces > 1 ? 's' : ''} au total</span>
          <ul class="bon-lignes">
            ${b.lignes.map((l) => `<li>${l.designation} — ${l.quantite}</li>`).join('')}
          </ul>
          <button class="secondaire" data-bon="${b.bon_id}">J'ai bien reçu ce bon</button>
          <p class="message" data-retour="${b.bon_id}"></p>
          ${b.conteste ? `
            <p class="message ko">Vous avez signalé : « ${echapper(b.message_conteste || '')} ».
               L'artisan le verra avant de répondre.</p>` : ''}
          <button class="signaler" data-contester="${b.bon_id}" aria-expanded="false">
            ${b.conteste ? 'Signaler autre chose' : 'Ce bon ne correspond pas'}
          </button>
          <div class="contest" data-zone="${b.bon_id}" style="display:none">
            <label for="mot-${b.bon_id}">Qu'est-ce qui ne correspond pas ?</label>
            <textarea id="mot-${b.bon_id}" rows="3"
              placeholder="Par exemple : il manque une bougie, ou une pièce n'est pas sur le bon."></textarea>
            <button class="principal" data-envoyer-conteste="${b.bon_id}">Envoyer à l'artisan</button>
            <p class="message" data-retour-conteste="${b.bon_id}"></p>
          </div>
        </div>`).join('')}` : ''}

    ${plusieurs ? `
      <h2>Artisan</h2>
      <select id="selecteur">
        ${etat.partenaires.map((x) => `<option value="${x.partenaire_id}" ${x.partenaire_id === p.partenaire_id ? 'selected' : ''}>${x.artisan}</option>`).join('')}
      </select>` : ''}

    ${p.pieces.length ? `
    <h2>${p.artisan} — chez ${p.boutique}</h2>
    <p class="aide">À gauche, ce qui devrait rester d'après les bons de dépôt et vos relevés.
       À droite, ce que vous comptez — c'est la différence qui nous dit ce qui est parti.</p>
    <table>
      <thead><tr><th>Pièce</th><th class="d">Il devrait<br>en rester</th><th class="d">Il vous en<br>reste</th></tr></thead>
      <tbody>
        ${p.pieces.map((pc) => `
          <tr data-cle="${pc.cle}">
            <td><span class="piece">${pc.designation}</span>
                <span class="sous">${eur(pc.prix)} pièce</span></td>
            <td class="d">${pc.reste}</td>
            <td class="d"><div class="pas">
              <button type="button" class="moins" aria-label="Une de moins">−</button>
              <input type="number" min="0" step="1" value="${pc.reste}" data-role="compte"
                     aria-label="Ce qu'il vous reste de ${pc.designation}">
              <button type="button" class="plus" aria-label="Une de plus">+</button>
            </div></td>
          </tr>
          <tr data-detail="${pc.cle}" style="display:none;background:#fff">
            <td colspan="3"><div class="mouvement" data-role="detail"></div></td>
          </tr>`).join('')}
      </tbody>
    </table>

    <h2>Un mot pour l'artisan (facultatif)</h2>
    <textarea id="note" rows="2" placeholder="Par exemple : la vitrine a été refaite cette semaine."></textarea>

    <button class="principal" id="envoyer">Envoyer mon relevé</button>
    <p class="message" id="retour"></p>` : `
    <h2>${p.artisan} — chez ${p.boutique}</h2>
    <p class="aide">Rien à compter pour l'instant : aucune pièce n'est encore arrivée chez vous.
       Le comptage s'ouvrira à votre premier bon confirmé.</p>`}

    <h2>Ce qu'il me faudrait</h2>
    <p class="aide">Les quantités sont déjà remplies avec ce que vous avez reçu la dernière fois :
       ajustez, ou mettez à zéro ce dont vous n'avez pas besoin. Une pièce que vous n'avez encore
       jamais reçue ? Ajoutez-la depuis la liste de l'artisan, pour la tester. Comptez
       ${p.delai_semaines} semaine${p.delai_semaines > 1 ? 's' : ''} de fabrication et de livraison.</p>
    <table>
      <thead><tr><th>Pièce</th><th class="d">Quantité</th></tr></thead>
      <tbody id="lignes-commande">
        ${p.pieces.map((pc) => ligneCommande(pc.cle, pc.designation, pc.derniere_quantite || 0, false)).join('')}
      </tbody>
    </table>
    ${catalogue.length ? `
      <select id="ajouter-piece" aria-label="Ajouter une pièce de l'artisan à ma demande">
        <option value="">+ Ajouter une pièce…</option>
        ${catalogue.map((c) => `<option value="${c.cle}" data-nom="${echapper(c.nom)}">${echapper(c.nom)}${c.prix != null ? ' · ' + eur(c.prix) : ''}</option>`).join('')}
      </select>
      <p class="aide">Ces pièces viennent du catalogue de l'artisan : celles qu'il ne vous a
         encore jamais confiées. La demander ne la commande pas — l'artisan confirme toujours.</p>` : ''}
    <textarea id="note-commande" rows="2" placeholder="Une précision sur votre demande (facultatif)"></textarea>
    <button class="secondaire" id="commander">Demander un réassort</button>
    <p class="message" id="retour-commande"></p>

    <h2>Vos derniers relevés</h2>
    <div id="historique"><p class="aide">Chargement…</p></div>

    <p class="note">
      <b>Signaler un bon ne le modifie pas</b> : c'est un message, et l'artisan seul décide de
      ce qu'il en fait. <b>Ceci ne remplace aucun document contractuel.</b> Les bons signés restent les pièces qui
      font foi ; cet espace sert à suivre la relation entre l'artisan et la boutique, et à vous
      éviter de tout noter à la main. Ce lien est le vôtre : l'artisan peut le désactiver à tout
      moment, et il ne montre que vos pièces — jamais celles des autres boutiques.
    </p>`

  if (plusieurs) {
    $('selecteur').addEventListener('change', (e) => {
      partenaireCourant = e.target.value
      afficher()
    })
  }

  // Le comptage : dès qu'un chiffre change, on montre ce que ça implique.
  for (const champ of contenu.querySelectorAll('input[data-role=compte]')) {
    champ.addEventListener('input', () => detailLigne(champ))
    detailLigne(champ)
  }

  cablerPas(contenu)

  for (const b of contenu.querySelectorAll('button[data-bon]')) {
    b.addEventListener('click', () => confirmer(b))
  }

  for (const b of contenu.querySelectorAll('button[data-contester]')) {
    b.addEventListener('click', () => ouvrirContestation(b))
  }
  for (const b of contenu.querySelectorAll('button[data-envoyer-conteste]')) {
    b.addEventListener('click', () => contester(b))
  }
  const boutonEnvoi = $('envoyer')      // absent quand il n'y a rien à compter
  if (boutonEnvoi) boutonEnvoi.addEventListener('click', envoyer)
  $('commander').addEventListener('click', commander)
  const ajout = $('ajouter-piece')
  if (ajout) ajout.addEventListener('change', () => ajouterPiece(ajout))
  chargerHistorique()
}

/** Le pas-à-pas : un appui, un cran. Le champ reste saisissable au clavier pour les grands
 *  nombres — compter 15 pièces à coups de « + » serait une punition. */
function cablerPas(racine) {
  for (const bouton of racine.querySelectorAll('.pas button')) {
    if (bouton.dataset.cable) continue
    bouton.dataset.cable = '1'
    bouton.addEventListener('click', () => {
      const champ = bouton.parentElement.querySelector('input')
      const cran = bouton.classList.contains('plus') ? 1 : -1
      champ.value = String(Math.max(0, Number(champ.value || 0) + cran))
      champ.dispatchEvent(new Event('input', { bubbles: true }))
    })
  }
}

function pieceDe(cle) {
  const p = etat.partenaires.find((x) => x.partenaire_id === partenaireCourant)
  return p.pieces.find((x) => x.cle === cle)
}

/** Ce que le comptage implique : une baisse se répartit entre vendues et reprises. */
function detailLigne(champ) {
  const ligne = champ.closest('tr')
  const cle = ligne.dataset.cle
  const piece = pieceDe(cle)
  const detail = contenu.querySelector(`tr[data-detail="${CSS.escape(cle)}"]`)
  const zone = detail.querySelector('[data-role=detail]')
  const compte = Number(champ.value)
  const attendu = Number(piece.reste)

  if (champ.value === '' || Number.isNaN(compte) || compte === attendu) {
    detail.style.display = 'none'
    return
  }

  detail.style.display = ''
  if (compte < attendu) {
    const ecart = attendu - compte
    zone.innerHTML = `
      <div class="repartition">
        <div class="repartition-titre">Il en manque <b>${ecart}</b> :</div>
        <div class="repartition-ligne">
          <span>vendues — facturées</span>
          <div class="pas mini">
            <button type="button" class="moins" aria-label="Une vente de moins">−</button>
            <input type="number" min="0" step="1" value="${ecart}" data-role="ventes" data-cle="${cle}"
                   aria-label="Vendues">
            <button type="button" class="plus" aria-label="Une vente de plus">+</button>
          </div>
        </div>
        <div class="repartition-ligne">
          <span>reprises — non facturées</span>
          <div class="pas mini">
            <button type="button" class="moins" aria-label="Une reprise de moins">−</button>
            <input type="number" min="0" step="1" value="0" data-role="reprises" data-cle="${cle}"
                   aria-label="Reprises">
            <button type="button" class="plus" aria-label="Une reprise de plus">+</button>
          </div>
        </div>
      </div>
      <span class="sous">Le total reste juste tout seul : une vente de plus, c'est une reprise de moins.</span>`

    // Une vente de plus, c'est une reprise de moins : la somme colle toujours à l'écart, donc
    // l'envoi ne peut pas être refusé pour un total faux.
    const champVentes = zone.querySelector('input[data-role=ventes]')
    const champReprises = zone.querySelector('input[data-role=reprises]')
    cablerPas(zone)
    const borne = (n) => Math.min(Math.max(Number(n) || 0, 0), ecart)
    champVentes.addEventListener('input', () => {
      const v = borne(champVentes.value)
      champVentes.value = String(v)
      champReprises.value = String(ecart - v)
    })
    champReprises.addEventListener('input', () => {
      const r = borne(champReprises.value)
      champReprises.value = String(r)
      champVentes.value = String(ecart - r)
    })
  } else {
    const ecart = compte - attendu
    zone.innerHTML = `<div class="repartition">Il y en a <b>${ecart}</b> de plus : c'est une livraison
      que l'artisan n'a pas encore enregistrée ?</div>
      <span class="sous">Ce sera noté comme une entrée, sans facturation.</span>`
  }
}

function collecter() {
  const lignes = []
  let erreur = null
  for (const champ of contenu.querySelectorAll('input[data-role=compte]')) {
    const ligne = champ.closest('tr')
    const cle = ligne.dataset.cle
    const piece = pieceDe(cle)
    if (champ.value === '') continue
    const compte = Number(champ.value)
    const attendu = Number(piece.reste)
    if (compte < 0) { erreur = 'Un nombre ne peut pas être négatif.'; continue }
    if (compte === attendu) continue

    if (compte > attendu) {
      lignes.push({ cle, entrees: compte - attendu })
      continue
    }
    const v = contenu.querySelector(`input[data-role=ventes][data-cle="${CSS.escape(cle)}"]`)
    const r = contenu.querySelector(`input[data-role=reprises][data-cle="${CSS.escape(cle)}"]`)
    const ventes = Number(v?.value || 0)
    const reprises = Number(r?.value || 0)
    const ecart = attendu - compte
    if (ventes + reprises !== ecart) {
      erreur = `Pour « ${piece.designation} », vendues + reprises doivent faire ${ecart}.`
      continue
    }
    lignes.push({ cle, ventes, reprises })
  }
  return { lignes, erreur }
}

async function confirmer(bouton) {
  const bon = bouton.dataset.bon
  const retour = contenu.querySelector(`p[data-retour="${CSS.escape(bon)}"]`)
  bouton.disabled = true
  const { data, error } = await supabase.rpc('boutique_confirmer_bon', { jeton_param: jeton, bon_param: bon })
  if (error || data?.erreur) {
    bouton.disabled = false
    retour.className = 'message ko'
    retour.textContent = 'La confirmation n\'est pas passée. Réessayez.'
    return
  }
  retour.className = 'message ok'
  retour.textContent = 'Merci. Ces pièces sont maintenant dans votre stock.'
  await demarrer()
}

/** Ouvrir (ou refermer) le champ de signalement d'un bon. */
function ouvrirContestation(bouton) {
  const bon = bouton.dataset.contester
  const zone = contenu.querySelector(`div[data-zone="${CSS.escape(bon)}"]`)
  const ouvert = zone.style.display !== 'none'
  zone.style.display = ouvert ? 'none' : ''
  bouton.setAttribute('aria-expanded', String(!ouvert))
  if (!ouvert) zone.querySelector('textarea').focus()
}

/** « Ce bon ne correspond pas » : un message à l'artisan. Le bon n'est pas touché — l'artisan
 *  décide de ce qu'elle en fait (un nouveau bon, une reprise, une correction de stock). */
async function contester(bouton) {
  const bon = bouton.dataset.envoyerConteste
  const zone = contenu.querySelector(`div[data-zone="${CSS.escape(bon)}"]`)
  const retour = contenu.querySelector(`p[data-retour-conteste="${CSS.escape(bon)}"]`)
  const message = (zone.querySelector('textarea').value || '').trim()

  if (message.length < 3) {
    retour.className = 'message ko'
    retour.textContent = "Écrivez une phrase, que l'artisan sache quoi regarder."
    return
  }

  bouton.disabled = true
  const { data, error } = await supabase.rpc('boutique_contester_bon', {
    jeton_param: jeton,
    bon_param: bon,
    message_param: message,
  })
  if (error || data?.erreur) {
    bouton.disabled = false
    retour.className = 'message ko'
    retour.textContent = "Le message n'est pas parti. Réessayez dans un instant."
    return
  }
  // Relecture de l'état : la carte affiche alors ce qui a été signalé, et le bon reste à
  // confirmer tant que vous ne l'avez pas confirmé.
  await demarrer()
}

async function envoyer() {
  const bouton = $('envoyer')
  const retour = $('retour')
  const { lignes, erreur } = collecter()
  retour.className = 'message'
  if (erreur) { retour.className = 'message ko'; retour.textContent = erreur; return }
  if (!lignes.length) { retour.textContent = 'Rien n\'a changé : il n\'y a rien à envoyer.'; return }

  bouton.disabled = true
  const { data, error } = await supabase.rpc('boutique_declarer', {
    jeton_param: jeton,
    partenaire_param: partenaireCourant,
    lignes_param: lignes,
    note_param: $('note').value,
  })
  bouton.disabled = false
  if (error || data?.erreur) {
    retour.className = 'message ko'
    retour.textContent = 'L\'envoi a échoué. Réessayez dans un instant.'
    return
  }
  retour.className = 'message ok'
  retour.textContent = data.facturable > 0
    ? `C'est envoyé. ${eur(data.facturable)} de ventes déclarées cette fois.`
    : 'C\'est envoyé. Aucune vente facturable cette fois.'
  if (data.alerte) {
    retour.textContent += ' Une ligne dépasse ce que l\'artisan avait déposé : il le verra.'
  }
  await demarrer()
}

/** Une ligne du réassort. Les pièces déjà reçues portent la quantité de la dernière fois ; celles
 *  ajoutées depuis le catalogue de l'artisan partent à 1 et peuvent être retirées. */
function ligneCommande(cle, designation, quantite, ajoutee) {
  return `
    <tr data-commande="${cle}"${ajoutee ? ' data-ajoutee="1"' : ''}>
      <td><span class="piece">${echapper(designation)}</span>${ajoutee
        ? '<button type="button" class="retirer">Retirer</button>' : ''}</td>
      <td class="d"><div class="pas">
        <button type="button" class="moins" aria-label="Une de moins">−</button>
        <input type="number" min="0" step="1" value="${quantite}" data-role="demande"
               aria-label="Quantité souhaitée pour ${echapper(designation)}">
        <button type="button" class="plus" aria-label="Une de plus">+</button>
      </div></td>
    </tr>`
}

/** Ajouter une pièce du catalogue : on pose sa ligne, et on désactive l'option — on ne demande pas
 *  deux fois la même chose dans le même envoi. */
function ajouterPiece(select) {
  const option = select.selectedOptions[0]
  if (!option || !select.value) return
  const cle = select.value
  const corps = $('lignes-commande')
  corps.insertAdjacentHTML('beforeend',
    ligneCommande(cle, option.dataset.nom || option.textContent, 1, true))
  const ligne = corps.querySelector(`tr[data-commande="${CSS.escape(cle)}"]`)
  ligne.querySelector('.retirer').addEventListener('click', () => {
    ligne.remove()
    option.disabled = false
    select.value = ''
  })
  cablerPas(corps)
  option.disabled = true
  select.value = ''
  ligne.querySelector('input[data-role=demande]').focus()
}

/** La demande est partie : on remet le formulaire à zéro. */
function viderDemande() {
  for (const champ of contenu.querySelectorAll('input[data-role=demande]')) champ.value = ''
  for (const ligne of contenu.querySelectorAll('tr[data-ajoutee]')) ligne.remove()
  for (const option of contenu.querySelectorAll('#ajouter-piece option')) option.disabled = false
  const select = $('ajouter-piece')
  if (select) select.value = ''
  $('note-commande').value = ''
}

async function commander() {
  const bouton = $('commander')
  const retour = $('retour-commande')
  const lignes = []
  for (const champ of contenu.querySelectorAll('input[data-role=demande]')) {
    const q = Number(champ.value)
    if (!champ.value || Number.isNaN(q) || q <= 0) continue
    lignes.push({ cle: champ.closest('tr').dataset.commande, quantite: q })
  }
  retour.className = 'message'
  if (!lignes.length) { retour.textContent = 'Indiquez au moins une quantité.'; return }

  bouton.disabled = true
  const { data, error } = await supabase.rpc('boutique_commander', {
    jeton_param: jeton,
    partenaire_param: partenaireCourant,
    lignes_param: lignes,
    note_param: $('note-commande').value,
  })
  bouton.disabled = false
  if (error || data?.erreur) {
    retour.className = 'message ko'
    retour.textContent = 'La demande n\'est pas partie. Réessayez dans un instant.'
    return
  }
  retour.className = 'message ok'
  retour.textContent = 'Votre demande est arrivée chez l\'artisan. Il la confirmera.'
  viderDemande()
}

async function chargerHistorique() {
  const zone = $('historique')
  const { data, error } = await supabase.rpc('boutique_historique', {
    jeton_param: jeton, partenaire_param: partenaireCourant,
  })
  const lignes = data?.historique || []
  if (error || !lignes.length) { zone.innerHTML = '<p class="aide">Aucun relevé pour l\'instant.</p>'; return }
  zone.innerHTML = `<table class="historique">
    <tbody>${lignes.map((h) => `
      <tr><td>${mois(h.declaration)}</td>
          <td>${h.ventes} vendue${h.ventes > 1 ? 's' : ''}${h.reprises ? `, ${h.reprises} reprise${h.reprises > 1 ? 's' : ''}` : ''}</td>
          <td class="d">${eur(h.facturable)}</td></tr>`).join('')}
    </tbody></table>`
}
</script>
</body>
